          #   curl -L -o logseq.AppImage \
          #     "https://github.com/logseq/logseq/releases/download/${LOGSEQ_VERSION}/Logseq-linux-x64-${LOGSEQ_VERSION}.AppImage"
          #   chmod +x logseq.AppImage
          #   echo "LOGSEQ_BIN=$PWD/logseq.AppImage" >> "$GITHUB_ENV"
          echo "TODO: implement Logseq download for ${LOGSEQ_VERSION}" && exit 1

      - name: Install Playwright system deps
        run: npx playwright install-deps

      - name: Run Tier 2 under Xvfb
        run: xvfb-run -a pnpm test:e2e
