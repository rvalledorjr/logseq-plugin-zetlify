name: E2E (Tier 2)
# High-fidelity integration gate: drives a REAL, pinned Logseq desktop instance under
# Xvfb via Playwright's Electron support, running the 8-row §7 matrix against the actual
# @logseq/libs API and the real /zetlify slash command. Covers what the Tier 1 mock
# cannot: real moveBlock UUID semantics, real slash-command registration, and the real
# embed transform. See docs/architecture.md and .sprint/ci-cd-test-enforcement/RESULTS.md.
#
# Runnable on demand (workflow_dispatch); consumed by publish.yml (workflow_call) as the
# fail-closed release gate.

on:
  workflow_dispatch:
  workflow_call:

env:
  # Pin the exact Logseq desktop version the suite is validated against (never "latest",
  # so an unrelated desktop update can't silently break the harness). Matches the version
  # the harness was developed against locally.
  LOGSEQ_VERSION: "0.10.15"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` — read the pinned pnpm from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Download + extract pinned Logseq desktop
        run: |
          set -euo pipefail
          url="https://github.com/logseq/logseq/releases/download/${LOGSEQ_VERSION}/Logseq-linux-x64-${LOGSEQ_VERSION}.AppImage"
          echo "Downloading $url"
          curl -fL -o logseq.AppImage "$url"
          chmod +x logseq.AppImage
          # Runners have no FUSE, so extract instead of mounting the AppImage.
          ./logseq.AppImage --appimage-extract >/dev/null
          echo "LOGSEQ_BIN=$PWD/squashfs-root/Logseq" >> "$GITHUB_ENV"

      - name: Install Playwright + Electron system deps
        run: npx playwright install-deps

      - name: Run Tier 2 under Xvfb
        run: xvfb-run -a pnpm test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
